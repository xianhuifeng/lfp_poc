services:
  - type: web
    name: lfd-poc-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OBJECTIVE_CHECK_MODE
        value: hybrid
      - key: CORS_ALLOW_ORIGINS
        sync: false
